baseURL = "/"
languageCode = "en-us"
title = "Site Screenshots Gallery"
theme = "gallery"
# Single-page gallery: no taxonomy/term pages (avoids layout warnings).
disableKinds = ["taxonomy", "term"]

[params]
  # Base public URL of the S3 bucket holding screenshots (no trailing slash).
  s3PublicUrl = "https://my-bucket.s3.amazonaws.com"
